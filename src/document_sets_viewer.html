<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История документов · S01–S16</title>
<style>
*{box-sizing:border-box}body{margin:0;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172333;background:#eef2f7;height:100vh;overflow:hidden}button,input{font:inherit}button,a{cursor:pointer}button{background:#fff;border:1px solid #d4deea;border-radius:7px;color:inherit;padding:7px 10px}button:hover{background:#edf4ff}a{color:#2563eb;text-decoration:none}header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fff;border-bottom:1px solid #d8e0ea}header strong{font-size:17px}#summary{color:#64748b}.layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 60px)}aside{background:#fff;border-right:1px solid #d8e0ea;overflow:auto;padding:18px 12px}h1{font-size:18px;margin:0 4px 12px}.hint{color:#7a8799;font-size:11px;line-height:1.6;margin:10px 4px}#search{padding:10px;width:100%;border:1px solid #d8e0ea;border-radius:7px;margin-bottom:12px}.set{display:block;width:100%;text-align:left;border-color:transparent;border-radius:8px;margin:3px 0;padding:10px;line-height:1.45}.set.selected{background:#eaf1ff;border-color:#b9cff7}.set b{font-variant-numeric:tabular-nums;color:#2563eb}.set small{display:block;color:#64748b;font-size:10px;margin-top:5px}.status{display:inline-block;font-size:10px;border-radius:4px;padding:3px 5px;background:#e5f4ec;color:#166b53}.status.review{background:#fff1d6;color:#945e00}.status.numeric{background:#eaf0ff;color:#315ba1}main{display:flex;min-width:0;min-height:0;flex-direction:column}.case{padding:14px 18px;background:#f9fbfd;border-bottom:1px solid #d8e0ea}.title{display:flex;align-items:center;gap:12px}.title h2{font-size:17px;margin:0;flex:1}.formula{font:14px ui-monospace,monospace;background:#eef2f7;border-radius:6px;padding:9px 12px;margin:10px 0}.refs{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}.ref{flex-shrink:0;font-size:11px;text-align:left;max-width:240px}.ref.active{background:#dceaff;border-color:#93b5ec}.ref span{display:block;color:#64748b;font-size:10px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0 0;gap:15px;font-size:11px;color:#64748b}.note{margin-top:8px;font-size:11px;color:#946000;line-height:1.5}iframe{border:0;width:100%;flex:1;min-height:0;background:#e9eef3}.file-info{display:flex;gap:10px;align-items:center;min-width:0}#fileName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#verification{margin-bottom:6px;font-size:12px}details{font-size:11px;margin:8px 0;color:#64748b}pre{max-height:130px;overflow:auto;white-space:pre-wrap}.empty{padding:20px;color:#64748b}@media(max-width:900px){.layout{grid-template-columns:235px 1fr}#summary{font-size:11px}.case{padding:10px}header{padding:0 12px}}
</style></head><body>
<header><strong>▦ История просмотра документов</strong><span id="summary"></span></header><div class="layout"><aside><h1>Наборы документов</h1><input id="search" type="search" placeholder="S01, ИИ, расходы…" aria-label="Поиск набора"><div id="sets"></div><p class="hint">Все наборы прочитаны пакетным скриптом. Метка «Просмотрен» появляется после загрузки файла в этом окне и сохраняется в браузере.</p><a href="document-sets.manifest.json" target="_blank">Полный отчёт проверки JSON ↗</a></aside>
<main><section class="case"><div class="title"><button id="previous" aria-label="Предыдущий набор">←</button><h2 id="title"></h2><button id="next" aria-label="Следующий набор">→</button></div><div id="formula" class="formula"></div><div id="verification"></div><div id="refs" class="refs"></div><div id="note" class="note"></div><details><summary>Как найдены исходные поля</summary><pre id="evidence"></pre></details><div class="bar"><div class="file-info"><span id="fileName"></span><a id="original" target="_blank">Исходный PDF ↗</a><a id="structure" target="_blank">Структура JSON ↗</a></div><span id="loading"></span></div></section><iframe id="viewer" title="PDF и иерархия выбранного документа"></iframe></main></div>
<script id="sets-data" type="application/json">__SETS_DATA__</script><script>
'use strict';
const manifest=JSON.parse(document.getElementById('sets-data').textContent),$=id=>document.getElementById(id);
let index=0,refIndex=0,visits={};const editedViewers=new Set();
function hasEdits(item){return item.documents.some(id=>editedViewers.has(manifest.documents.find(d=>d.id===id)?.viewer));}
try{visits=JSON.parse(localStorage.getItem('pdf-structure-set-history')||'{}');if(!visits||typeof visits!=='object'||Array.isArray(visits))visits={};}catch{}
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
function status(item){if(hasEdits(item))return 'Есть правки · пересверить';return item.status==='verified'?'Поля + формула':item.status==='verified_values'?'Числа + формула':'Требует проверки';}
function renderList(){const list=$('sets');list.replaceChildren();const q=$('search').value.toLowerCase();for(const [i,item]of manifest.sets.entries()){if(!(item.id+' '+item.title).toLowerCase().includes(q))continue;const b=el('button');b.className='set'+(i===index?' selected':'');b.dataset.set=item.id;const name=el('div');name.append(el('b',item.id+' '),document.createTextNode(item.title));const badge=el('span',status(item));badge.className='status'+((item.status==='needs_review'||hasEdits(item))?' review':item.status==='verified_values'?' numeric':'');b.append(name,badge,el('small',(visits[item.id]?'Просмотрен · ':'Разобран · ')+item.documents.length+' файл(а)'));b.onclick=()=>openSet(i);list.append(b);}}
function openReference(i){refIndex=i;const item=manifest.sets[index],match=item.matches[i],ref=match.reference,doc=manifest.documents.find(d=>d.id===ref['документ']);for(const [n,b]of [...$('refs').children].entries())b.classList.toggle('active',n===i);$('fileName').textContent=doc.name+' · PDF-с. '+ref['страница_PDF'];$('original').href=doc.original+'#page='+ref['страница_PDF'];$('structure').href=doc.structure;$('loading').textContent='Открываю файл…';const [urlPath,urlHash]=match.url.split('#');$('viewer').src=urlPath+'?ui=5'+(urlHash?'#'+urlHash:'');}
function openSet(i){index=(i+manifest.sets.length)%manifest.sets.length;const item=manifest.sets[index];history.replaceState(null,'','#set='+item.id);$('title').textContent=item.id+' · '+item.title;$('formula').textContent=item.formula+' → '+(item.calculated??'не вычислено')+' (итог в PDF: '+(item.matches[0].actual??'не найден')+')';$('verification').textContent=status(item)+' · '+item.matches.filter(m=>m.status==='matched').length+'/'+item.matches.length+' ссылок найдены однозначно';$('note').textContent=(item.status==='verified_values'?'Итоговый показатель найден по уникальному числу на указанной странице; смысловую привязку нужно проверить. ':'')+item.note;$('evidence').textContent=item.matches.map((m,n)=>(n?'Источник '+n:'Итог')+': '+m.method+' · '+m.status+' · PDF='+m.source_value+' · ожидается='+m.reference['значение']+(m.normalization?' · '+m.normalization:'')).join('\n');$('refs').replaceChildren();item.matches.forEach((match,n)=>{const b=el('button',n?'Источник '+n+' · '+match.reference['значение']:'Итог · '+match.reference['значение']);b.className='ref';b.dataset.reference=n;b.append(el('span',match.reference['строка_или_показатель']));b.onclick=()=>openReference(n);$('refs').append(b);});renderList();openReference(0);}
$('viewer').addEventListener('load',()=>{if(!$('viewer').getAttribute('src'))return;const item=manifest.sets[index],ref=item.matches[refIndex].reference;const saved=visits[item.id]||{files:[]};saved.last_viewed=new Date().toISOString();const id=ref['документ'];if(!saved.files.includes(id))saved.files.push(id);visits[item.id]=saved;try{localStorage.setItem('pdf-structure-set-history',JSON.stringify(visits));}catch{}$('loading').textContent='Файл открыт';renderList();});
function correctionWarning(){const item=manifest.sets[index];if(hasEdits(item)){$('verification').textContent='Есть сохранённые правки. Формула выше показывает исходный прогон; требуется повторная сверка.';$('note').textContent='Ручные исправления восстановлены с диска. '+item.note;}else{$('verification').textContent=status(item)+' · '+item.matches.filter(m=>m.status==='matched').length+'/'+item.matches.length+' ссылок найдены однозначно';$('note').textContent=(item.status==='verified_values'?'Итоговый показатель найден по уникальному числу на указанной странице; смысловую привязку нужно проверить. ':'')+item.note;}}
const originalOpenSet=openSet;openSet=function(i){originalOpenSet(i);correctionWarning();};
async function reloadCorrectionStatus(){try{const response=await fetch('/api/edit-status',{cache:'no-store'});if(!response.ok)return;const statuses=await response.json();editedViewers.clear();for(const entry of statuses)if(entry.operation_count)editedViewers.add(entry.viewer);renderList();correctionWarning();}catch{}}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==$('viewer').contentWindow||event.data?.type!=='structure-edited')return;reloadCorrectionStatus();});
reloadCorrectionStatus();
$('search').oninput=renderList;$('previous').onclick=()=>openSet(index-1);$('next').onclick=()=>openSet(index+1);const sum=manifest.summary;$('summary').textContent=sum.sets+' наборов · '+sum.documents+' уникальных PDF · '+sum.pages+' страниц';const initial=new URLSearchParams(location.hash.slice(1)).get('set');openSet(Math.max(0,manifest.sets.findIndex(s=>s.id===initial)));
</script></body></html>
