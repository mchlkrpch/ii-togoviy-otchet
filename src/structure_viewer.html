<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Атлас структуры PDF</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172333;background:#e9eef3;font-size:13px}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid #d6dee7;background:#fff;border-radius:7px;padding:7px 10px;color:inherit}button:hover{background:#edf4ff;border-color:#b0c4e1}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #2563eb;outline-offset:2px}.top{height:62px;background:#fff;border-bottom:1px solid #d7dfe8;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:20px}.brand{font-size:16px;font-weight:700;white-space:nowrap}.brand span{color:#2563eb;margin-right:9px}.filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#64748b}.local{font-size:11px;border:1px solid #ccdfd9;border-radius:20px;padding:5px 9px;color:#166b53;white-space:nowrap}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100vh - 62px)}aside{background:#fff;border-right:1px solid #d7dfe8;display:flex;flex-direction:column;min-height:0}.sidehead{padding:19px 17px 12px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.3px;color:#7a8799;margin-bottom:7px}.sidehead h1{font-size:19px;margin:0 0 15px}.search{border:1px solid #dce3eb;border-radius:8px;padding:9px 10px;width:100%;background:#f8fafc}.tabs{display:flex;margin-top:11px;gap:4px}.tabs button{flex:1;font-size:12px;background:#f3f6fa;border-color:transparent}.tabs button.active{color:#1d4ed8;background:#e9f0ff;font-weight:650}.tree-tools{display:flex;justify-content:space-between;padding:0 17px 10px;gap:6px}.tree-tools button{font-size:11px;padding:5px 7px}.tree{overflow:auto;flex:1;padding:0 10px 16px}.tree ul{list-style:none;padding:0;margin:0}.tree ul ul{padding-left:14px;border-left:1px solid #e4e9f0;margin-left:10px}.tree-row{display:flex;align-items:flex-start;gap:3px;margin:2px 0;border-radius:6px}.tree-row.selected{background:#eaf1ff;box-shadow:inset 2px 0 #2563eb}.disclosure{border:0;background:transparent;padding:7px 1px;min-width:18px;color:#8a97a7}.node{display:flex;align-items:flex-start;text-align:left;border:0;background:transparent;flex:1;min-width:0;padding:7px 5px;line-height:1.4}.node:hover,.disclosure:hover{background:#f1f5f9}.dot{width:7px;height:7px;border-radius:2px;background:var(--color);flex-shrink:0;margin:5px 8px 0 0}.node-label{overflow-wrap:anywhere}.value-label{font-variant-numeric:tabular-nums;font-weight:650}.row-label{display:block;color:#7b8797;font-size:10px;font-weight:400;margin-top:2px}.flag{color:#b45309;margin-left:5px}.sidefoot{padding:12px 17px;border-top:1px solid #e2e8f0;color:#7b8797;font-size:11px;line-height:1.6}main{display:flex;flex-direction:column;min-height:0;min-width:0}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#f8fafc;border-bottom:1px solid #d7dfe8}.toolbar select{background:white;border:1px solid #d6dee7;border-radius:6px;padding:6px;max-width:130px}.toolbar label{display:flex;align-items:center;gap:4px;font-size:12px;color:#546174}.toolbar .separator{height:20px;width:1px;background:#d7dfe8;margin:0 2px}#zoomLabel{width:45px;text-align:center;font-variant-numeric:tabular-nums}.viewport{flex:1;overflow:auto;padding:25px;position:relative;background:radial-gradient(#c6d0dd .7px,transparent .7px) 0 0/12px 12px}.paper{position:relative;background:white;box-shadow:0 4px 25px #263a5425;margin:0 auto}.paper img{display:block;width:100%;height:100%;user-select:none}.paper svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.branch{fill-opacity:.045;stroke-width:1.4;vector-effect:non-scaling-stroke;pointer-events:none}.field{fill-opacity:.015;stroke-opacity:.47;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}.field:hover{fill-opacity:.25;stroke-opacity:1;stroke-width:1.8}.chosen{stroke-width:2.3;fill-opacity:.13;vector-effect:non-scaling-stroke;pointer-events:none}.chosen-cell{stroke-width:1.5;fill-opacity:.16;vector-effect:non-scaling-stroke;pointer-events:none}.svg-label{font-family:system-ui;font-size:5px;fill:#fff;pointer-events:none}.inspector{background:#fff;border-top:1px solid #d7dfe8;padding:15px 20px;max-height:235px;overflow:auto}.inspector-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}#detailTitle{font-weight:650;font-size:14px;line-height:1.5}.badge{font-size:10px;background:#eff3f8;border-radius:4px;padding:4px 7px;white-space:nowrap}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 24px;margin-top:12px;font-size:12px;line-height:1.6}.detail-grid label{display:block;font-size:10px;letter-spacing:.5px;color:#7b8797;margin-bottom:2px}.path{overflow-wrap:anywhere}#detailValue{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}#review{color:#a75e09;font-size:11px;margin-top:8px}.empty{padding:20px 10px;color:#7b8797}.selection-off .branch,.selection-off .field{display:none}.mobilehint{display:none}@media(max-width:850px){.layout{grid-template-columns:260px minmax(0,1fr)}.top{padding:0 12px}.local{display:none}.toolbar{padding:8px;gap:5px}.toolbar label{font-size:11px}.viewport{padding:12px}.detail-grid{grid-template-columns:1fr}.inspector{max-height:185px}}@media print{body{height:auto;overflow:visible}.top,aside,.toolbar,.inspector{display:none}.layout{display:block;height:auto}.viewport{overflow:visible;padding:0;background:#fff}.paper{width:100%!important;height:auto!important;aspect-ratio:var(--ratio);box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span>▦</span>Атлас структуры</div><div id="filename" class="filename"></div><a id="historyLink" target="_top" style="color:#2563eb;white-space:nowrap;text-decoration:none">История наборов ↗</a><div class="local">● Локальный документ</div></header>
<div class="layout"><aside><div class="sidehead"><div class="eyebrow">КАРТА ДОКУМЕНТА</div><h1>Иерархия полей</h1><input id="search" class="search" type="search" placeholder="Найти поле или значение…" aria-label="Поиск по структуре"><div class="tabs"><button id="byHeaders" class="active">По заголовкам</button><button id="byRows">По строкам</button></div></div><div class="tree-tools"><button id="expand">Раскрыть всё</button><button id="collapse">Свернуть</button><button id="reset">Снять выбор</button></div><nav id="tree" class="tree" aria-label="Дерево структуры"></nav><div id="stats" class="sidefoot"></div></aside>
<main><div class="toolbar"><select id="page" aria-label="Страница"></select><span class="separator"></span><button id="minus" aria-label="Уменьшить">−</button><span id="zoomLabel">100%</span><button id="plus" aria-label="Увеличить">+</button><button id="fit">По ширине</button><button id="goTable">К таблице</button><span class="separator"></span><label><input id="branches" type="checkbox" checked>Ветки</label><select id="depth" aria-label="Уровень иерархии"><option value="1">Уровень 1</option><option value="2">Уровень 2</option><option value="3">Уровень 3</option><option value="4">Уровень 4</option><option value="all">Все уровни</option></select><label><input id="fields" type="checkbox" checked>Ячейки</label><label><input id="labels" type="checkbox" checked>Метки</label><button id="original">Оригинал</button></div>
<div id="viewport" class="viewport"><div id="paper" class="paper"><img id="image" alt="Страница исходного PDF"><svg id="overlay" xmlns="http://www.w3.org/2000/svg" aria-label="Границы веток и полей"></svg></div></div>
<section class="inspector" aria-live="polite"><div class="inspector-top"><div id="detailTitle">Выберите ветку в дереве или ячейку на странице</div><span id="detailKind" class="badge">Обзор структуры</span></div><div class="detail-grid"><div><label>ПУТЬ ПОЛЯ</label><div id="detailRow" class="path" style="color:#b45309"></div><div id="detailPath" class="path">Цветные рамки показывают границы групп и подветок.</div></div><div><label>ЗНАЧЕНИЕ / ОБЛАСТЬ</label><div id="detailValue">—</div><div id="detailMeaning" style="color:#0f766e"></div><div id="detailCoords"></div></div></div><div id="review"></div></section>
</main></div>
<script id="document-data" type="application/json">__DOCUMENT_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById('document-data').textContent);
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
let pageIndex=0, mode='headers', selected=null, zoom=1, original=false, map=new Map(), expanded=new Set();
const page=()=>data.pages[pageIndex];
function element(tag, cls, text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function descendants(id){const node=map.get(id);return node?[node,...node.children.flatMap(descendants)]:[];}
function formatValue(n){if(n.value_type==='decimal'){const parts=n.label.split('.');parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return parts.join(',');}return n.label;}
function normalized(s){return String(s).normalize('NFKC').toLocaleLowerCase('ru').replaceAll('ё','е').replace(/[^\p{L}\p{N}]+/gu,' ').trim();}
function matching(id,q){const n=map.get(id);const stop=new Set(['за','в','на','по','г','год','году','значение','показатель']);const tokens=normalized(q).split(' ').filter(t=>!stop.has(t));const hay=normalized([n.label,n.value||'',...(n.column_path||[]),...(n.row_path||[]),...(n.row_hierarchy||[]),n.unit||''].join(' ')).split(' ');return tokens.every(t=>hay.some(h=>h===t||t.length>=4&&h.startsWith(t)))||n.children.some(c=>matching(c,q));}
function renderTree(){const root=$('tree');root.replaceChildren();const q=$('search').value.toLocaleLowerCase('ru').trim();const list=element('ul');
 function nodeItem(id){const n=map.get(id);if(!n||q&&!matching(id,q))return null;const li=element('li'),row=element('div','tree-row'+(selected===id?' selected':''));row.dataset.node=id;const toggle=element('button','disclosure',n.children.length?(expanded.has(id)||q?'▾':'▸'):'·');toggle.setAttribute('aria-label','Раскрыть '+n.label);toggle.disabled=!n.children.length;toggle.setAttribute('aria-expanded',String(expanded.has(id)||!!q));toggle.onclick=()=>{expanded.has(id)?expanded.delete(id):expanded.add(id);renderTree();};const button=element('button','node');button.title=n.label;button.dataset.select=id;const dot=element('span','dot');dot.style.setProperty('--color',n.color);button.append(dot);const label=element('span','node-label'+(n.kind==='value'?' value-label':''),n.kind==='value'?formatValue(n):n.kind==='key_value'?n.label+' → '+n.value:n.label);if(n.kind==='value'&&mode==='headers')label.append(element('span','row-label',(n.row_hierarchy||n.row_path||[]).join(' → ')));if(n.needs_review)label.append(element('span','flag','⚑'));button.append(label);button.onclick=()=>select(id);row.append(toggle,button);li.append(row);if(n.children.length&&(expanded.has(id)||q)){const children=element('ul');for(const c of n.children){const item=nodeItem(c);if(item)children.append(item);}li.append(children);}return li;}
 if(mode==='headers'){for(const id of page().roots){const li=nodeItem(id);if(li)list.append(li);}const texts=page().nodes.filter(n=>n.kind==='text'&&!n.parent&&!page().roots.includes(n.id)&&(!q||n.label.toLocaleLowerCase('ru').includes(q)));if(texts.length){const li=element('li');const details=element('details');const summary=element('summary',null,'Текст вне таблиц · '+texts.length);details.append(summary);for(const n of texts){const item=nodeItem(n.id);if(item)details.append(item);}li.append(details);list.append(li);}}
 else{const groups=[];for(const group of page().row_roots){let branch=groups;const path=group.hierarchy_path?.length?group.hierarchy_path:[group.label];for(const label of path){let item=branch.find(n=>n.label===label);if(!item){item={label,groups:[],ids:[]};branch.push(item);}branch=item.groups;if(label===path.at(-1))item.ids.push(...group.children);}}function groupItem(group){const children=group.ids.map(nodeItem).filter(Boolean);const sub=group.groups.map(groupItem).filter(Boolean);if(!children.length&&!sub.length)return null;const li=element('li'),details=element('details');details.open=true;details.append(element('summary',null,group.label));const ul=element('ul');ul.append(...sub,...children);details.append(ul);li.append(details);return li;}for(const group of groups){const item=groupItem(group);if(item)list.append(item);}}

 root.append(list);if(!list.children.length)root.append(element('div','empty','Совпадений нет'));
}
function rect(box,color,cls,attrs={}){const e=document.createElementNS(NS,'rect');const[x,y,x1,y1]=box;for(const[k,v]of Object.entries({x,y,width:x1-x,height:y1-y,fill:color,stroke:color,class:cls,...attrs}))e.setAttribute(k,String(v));return e;}
function draw(){const svg=$('overlay');svg.replaceChildren();svg.classList.toggle('selection-off',original);if(original)return;const groupLayer=document.createElementNS(NS,'g'),fieldLayer=document.createElementNS(NS,'g');svg.append(groupLayer,fieldLayer);const depth=$('depth').value;
 if($('branches').checked)for(const n of page().nodes.filter(n=>n.kind==='header'&&(depth==='all'||n.depth===Number(depth)))){groupLayer.append(rect(n.bbox,n.color,'branch',{'data-group':n.id}));if($('labels').checked){const[x,y,x1]=n.bbox;const label=`${n.column_span>1?n.column+'–'+(n.column+n.column_span-1):n.column} · L${n.depth}`;groupLayer.append(rect([x,y,Math.min(x1,x+25),y+7],n.color,'branch',{'fill-opacity':'.9'}));const t=document.createElementNS(NS,'text');t.setAttribute('x',x+1);t.setAttribute('y',y+5);t.setAttribute('class','svg-label');t.textContent=label;groupLayer.append(t);}}
 if($('fields').checked)for(const n of page().nodes.filter(n=>n.field_bbox)){const e=rect(n.field_bbox,n.color,'field',{'data-field':n.id});const title=document.createElementNS(NS,'title');title.textContent=n.label;e.append(title);e.onclick=()=>select(n.id);fieldLayer.append(e);}
 if(selected&&map.has(selected)){const n=map.get(selected);const layer=document.createElementNS(NS,'g');layer.setAttribute('id','selection-layer');svg.append(layer);if(n.row_bbox)layer.append(rect(n.row_bbox,'#d97706','chosen',{'fill-opacity':'.025','stroke-dasharray':'4 3','data-axis':'row-band'}));for(const b of n.column_header_bboxes||[])layer.append(rect(b,'#2563eb','chosen-cell',{'data-axis':'column'}));for(const b of n.row_header_bboxes||[])layer.append(rect(b,'#d97706','chosen-cell',{'data-axis':'row'}));if(n.kind==='key_value'){layer.append(rect(n.key_bbox,'#2563eb','chosen-cell',{'data-axis':'key'}));layer.append(rect(n.value_bbox,'#0f766e','chosen-cell',{'data-axis':'value'}));}layer.append(rect(n.bbox,n.color,'chosen'));for(const child of descendants(n.id)){if(child.field_bbox)layer.append(rect(child.field_bbox,n.color,'chosen-cell'));}if(n.kind==='header')layer.append(rect(n.field_bbox,n.color,'chosen',{'stroke-dasharray':'3 2'}));}
}
function select(id){selected=id;const n=map.get(id);if(!n)return;original=false;$('original').textContent='Оригинал';for(let p=n.parent;p;){expanded.add(p);p=map.get(p)?.parent;}renderTree();draw();
 $('detailTitle').textContent=n.kind==='value'?(n.row_hierarchy||n.row_path||[]).join(' → ')+' · '+(n.column_path||[]).at(-1):n.label;
 $('detailKind').textContent={header:'Ветка · уровень '+n.depth,value:'Табличный факт',table:'Таблица',text:'Текст',key_value:'Ключ → значение',metadata:'Реквизиты'}[n.kind];
 $('detailRow').textContent=n.kind==='value'?'Строка: '+(n.row_hierarchy||n.row_path||[]).join(' → '):'';
 $('detailPath').textContent=(n.column_path||[]).join(' → ')||n.label;
 $('detailValue').textContent=n.kind==='key_value'?n.value:n.kind==='value'?formatValue(n):n.kind==='header'?`Граф${n.column_span===1?'а':'ы'} ${n.column}${n.column_span>1?'–'+(n.column+n.column_span-1):''} · ${descendants(n.id).filter(c=>c.kind==='value').length} значений`:'Область на странице';
 $('detailMeaning').textContent=n.kind==='value'&&n.metric?n.metric+': '+formatValue(n)+(n.unit?' '+n.unit:'')+' · '+(n.row_hierarchy||n.row_path||[]).join(' → '):n.kind==='key_value'?JSON.stringify({[n.key]:n.value}):'';
 $('detailCoords').textContent='Границы: ['+n.bbox.map(v=>v.toFixed(1)).join(', ')+'] pt';
 $('review').textContent=n.manual?'Ручное исправление сохранено. Зависимые сверки требуют повторной проверки.':n.needs_review?'⚑ Требуется проверка OCR. '+(n.alternatives?.length?'Варианты: '+n.alternatives.map(c=>c.text).join(' / '):'Низкая уверенность распознавания заголовка.'):'Координаты привязаны к исходной странице PDF.';}

function resize(){const width=Math.max(200,$('viewport').clientWidth-50)*zoom;const[w,h]=page().size;$('paper').style.width=width+'px';$('paper').style.height=width*h/w+'px';$('paper').style.setProperty('--ratio',w+'/'+h);$('zoomLabel').textContent=Math.round(zoom*100)+'%';}
function changePage(){map=new Map(page().nodes.map(n=>[n.id,n]));selected=null;expanded=new Set(page().roots);$('image').src=page().image;$('overlay').setAttribute('viewBox','0 0 '+page().size.join(' '));const headers=page().nodes.filter(n=>n.kind==='header'),values=page().nodes.filter(n=>n.kind==='value');$('stats').textContent=`${headers.length} заголовков · ${values.length} ячеек данных\nЦвет — ветка верхнего уровня. L — глубина. ⚑ — проверить OCR.`;$('detailTitle').textContent='Выберите ветку в дереве или ячейку на странице';$('detailKind').textContent='Обзор структуры';$('detailPath').textContent='Цветные рамки показывают границы групп и подветок.';$('detailValue').textContent='—';$('detailCoords').textContent='';$('detailRow').textContent='';$('detailMeaning').textContent='';$('review').textContent='';renderTree();resize();draw();$('viewport').scrollTo(0,0);}
$('historyLink').href=location.pathname.includes('/sets/')?'../document-sets.html':'document-sets.html';$('filename').textContent=data.name;document.title='Структура · '+data.name;for(const p of data.pages){const opt=element('option',null,'Страница '+p.number);opt.value=String(p.number);$('page').append(opt);}$('page').onchange=()=>{pageIndex=$('page').selectedIndex;changePage();};$('search').oninput=renderTree;
$('byHeaders').onclick=()=>{mode='headers';$('byHeaders').classList.add('active');$('byRows').classList.remove('active');renderTree();};$('byRows').onclick=()=>{mode='rows';$('byRows').classList.add('active');$('byHeaders').classList.remove('active');renderTree();};
$('expand').onclick=()=>{expanded=new Set(map.keys());renderTree();};$('collapse').onclick=()=>{expanded=new Set(page().roots);renderTree();};$('reset').onclick=()=>{selected=null;renderTree();draw();$('detailTitle').textContent='Выбор снят';$('detailKind').textContent='Обзор структуры';$('detailPath').textContent='Выберите ветку или ячейку';$('detailValue').textContent='—';$('detailCoords').textContent='';$('detailRow').textContent='';$('detailMeaning').textContent='';$('review').textContent='';};
for(const id of ['branches','fields','labels','depth'])$(id).onchange=draw;$('minus').onclick=()=>{zoom=Math.max(.4,zoom-.25);resize();};$('plus').onclick=()=>{zoom=Math.min(5,zoom+.25);resize();};$('fit').onclick=()=>{zoom=1;resize();};$('goTable').onclick=()=>{const n=page().nodes.find(n=>n.kind==='table');if(!n)return;zoom=Math.max(1.5,zoom);resize();const ratio=parseFloat($('paper').style.width)/page().size[0];$('viewport').scrollTo({left:Math.max(0,n.bbox[0]*ratio-20),top:Math.max(0,n.bbox[1]*ratio-35),behavior:'smooth'});};$('original').onclick=()=>{original=!original;$('original').textContent=original?'Показать структуру':'Оригинал';draw();};window.addEventListener('resize',resize);
function openLocation(){const params=new URLSearchParams(location.hash.slice(1));const number=Number(params.get('page'));const index=data.pages.findIndex(p=>p.number===number);pageIndex=index>=0?index:0;$('page').selectedIndex=pageIndex;changePage();const focus=params.get('focus');if(focus&&map.has(focus)){select(focus);const n=map.get(focus);zoom=1.5;resize();const ratio=parseFloat($('paper').style.width)/page().size[0];$('viewport').scrollTo({left:Math.max(0,n.bbox[0]*ratio-80),top:Math.max(0,n.bbox[1]*ratio-100)});}}
window.addEventListener('hashchange',openLocation);openLocation();
</script>
</body></html>
