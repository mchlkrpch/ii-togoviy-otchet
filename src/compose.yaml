services:
  verification:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${AUDIT_PORT:-8765}:8765"
    volumes:
      - ../вводные:/data/input:ro
      - ./.data/docker:/data/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped
